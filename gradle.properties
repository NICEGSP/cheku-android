org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.workers.max=1

android.builtInKotlin=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
kotlin.compiler.execution.strategy=in-process

# 允许项目放在含非 ASCII 字符的路径下
android.overridePathCheck=true

# 服务端配置不要写在这里，写到 local.properties（不入库）或 ~/.gradle/gradle.properties，
# 见 README「服务端配置」：
# CHEKU_WEBSITE_URL=https://www.example.com
# CHEKU_CONFIG_PUBLIC_KEY=<运行时配置签名公钥，SPKI DER 的 base64>
# CHEKU_CERT_PINS=<证书公钥指纹，逗号分隔>
